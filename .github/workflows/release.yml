name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.2), must equal VERSION in src/constants.py'
        required: true

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 用户输入只经环境变量传入脚本，不直接拼进 shell 代码
      - name: Determine tag and check it matches VERSION
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          version="$(python -c 'from src.constants import VERSION; print(VERSION)' | tr -d '\r')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag does not match VERSION ($version) in src/constants.py"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "nuitka[onefile]"

      # 编译参数统一维护在 nuitka_build.bat 中
      - name: Build with Nuitka
        shell: cmd
        env:
          OUTPUT_NAME: dcsm_${{ steps.tag.outputs.tag }}.exe
        run: call nuitka_build.bat "%OUTPUT_NAME%"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcsm-windows
          path: dist/dcsm_${{ steps.tag.outputs.tag }}.exe

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: DCSM ${{ needs.build-windows.outputs.tag }}
          draft: true
          files: dcsm-windows/dcsm_${{ needs.build-windows.outputs.tag }}.exe
